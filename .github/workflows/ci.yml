name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install locked dependencies
        run: pip install -r backend/requirements-lock.txt
      - name: Run backend tests
        shell: bash
        run: |
          set -o pipefail
          set +e
          python -m pytest backend/tests -q 2>&1 | tee backend-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python -c 'from pathlib import Path; text = Path("backend-test.log").read_text(encoding="utf-8", errors="replace")[-12000:]; text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error::Backend pytest output%0A" + text)'
            exit "$status"
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test
      - name: Type-check and build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: yueji-reading-companion:ci
